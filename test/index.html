<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <style>
        body, html{
            background-color:#fff;
            margin: 0px;
            overflow-x: hidden;
            overflow-y: auto;
            width: 100%;
            height: 100%;
        }

        #lottie{
            background-color:#fff;
            width:100%;
            height:100%;
            display:block;
            overflow: hidden;
            transform: translate3d(0,0,0);
            pointer-events: none;
            /*display:none;*/
        }

    </style>
    <script>
        // Some animations (banner.json) use a text animator with randomized
        // order, which calls Math.random while the text is being laid out. The
        // player captures Math.random when it loads, so this has to come first.
        (function seedRandom() {
            var state = 0x9e3779b9;
            Math.random = function random() {
                state += 0x6d2b79f5;
                var t = state;
                t = Math.imul(t ^ (t >>> 15), t | 1);
                t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
        }());
    </script>
    <script src="/lottie.min.js" ></script>


</head>
<body>
<div id="lottie"></div>
<script>
    const buildRenderSettings = (searchParams) => {
        const defaultValues = {
            path: '/test/animations/adrock.json',
            renderer: 'svg',
        };
        searchParams.forEach((value, key) => {
            defaultValues[key] = value;
        });

        return defaultValues;
    };
</script>
<script>
    // Text layers are laid out from measurements taken while the font manager
    // is still resolving fonts, and it gives up after a timeout. Rendering
    // before it settles positions text differently from one run to the next,
    // which is what made the banner animation flaky.
    const waitForFontManager = (animation) => new Promise((resolve) => {
        const start = Date.now();
        const check = () => {
            const renderer = animation.renderer;
            const fontManager = renderer && renderer.globalData && renderer.globalData.fontManager;
            if (!fontManager || fontManager.isLoaded || Date.now() - start > 15000) {
                resolve();
            } else {
                setTimeout(check, 20);
            }
        };
        check();
    });

    // Fonts resolve lazily, so the first frames containing text used to be
    // captured with different glyph metrics from one run to the next. Waiting
    // for fonts and for a painted frame makes the screenshot reproducible.
    const waitForStablePaint = () => (
        document.fonts.ready.then(() => new Promise((resolve) => {
            requestAnimationFrame(() => requestAnimationFrame(resolve));
        }))
    );

    const submitAndWaitForResponse = async (currentFrame, isLast) => {
        await waitForStablePaint();
        window.onMessageReceivedEvent({
            currentFrame,
            isLast,
        });
    };
</script>
<script>
    const waitContinueCommand = () => {
        return new Promise((resolve) => {
            window.continueExecution = resolve;
        })
    }
</script>
<script>

    window.startProcess = () => {
        const url = new URL(window.location);
        const settings = buildRenderSettings(url.searchParams)
        const animation = lottie.loadAnimation({
            container: document.getElementById('lottie'),
            path: settings.path,
            autoplay: false,
            loop: false,
            renderer: settings.renderer,
        })
        animation.addEventListener('data_failed', () => {
            window.onAnimationFailed('Animation data failed to load: ' + settings.path);
        })
        animation.addEventListener('error', (error) => {
            window.onAnimationFailed('Animation error: ' + ((error && error.message) || 'unknown'));
        })
        animation.addEventListener('DOMLoaded', async () => {
            await waitForFontManager(animation);
            window.onAnimationLoaded();
            try {
                let totalFrames = animation.totalFrames;
                let currentFrame = 0;
                while (currentFrame <= totalFrames) {
                    await waitContinueCommand();
                    animation.goToAndStop(currentFrame, true);
                    await submitAndWaitForResponse(
                        currentFrame,
                        currentFrame === totalFrames,
                    );
                    currentFrame += 1;

                }
            } catch (error) {
                window.onAnimationFailed('Rendering error: ' + error.message);
            }
        })
    }
    // window.startProcess();
</script>

</body>
</html>
